# Hyperparameters cho BEATs (base).
model:
  input_patch_size: 16
  embed_dim: 512            # kênh sau patch embedding
  encoder_embed_dim: 768
  encoder_layers: 12
  encoder_attention_heads: 12
  encoder_ffn_embed_dim: 3072
  deep_norm: true
  conv_pos: 128
  conv_pos_groups: 16
  relative_position_embedding: true
  num_buckets: 320
  max_distance: 800
  gru_rel_pos: true
  dropout: 0.0
  attention_dropout: 0.0
  activation_dropout: 0.0
  dropout_input: 0.0
  predictor_dropout: 0.1
  num_classes: 36

frontend:
  sample_rate: 16000
  num_mel_bins: 128
  frame_length: 25
  frame_shift: 10
  fbank_mean: 15.41663
  fbank_std: 6.55582

train:
  optimizer: adamw
  lr: 5.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.98]
  scheduler: cosine
  warmup_ratio: 0.1
  batch_size: 32
  eval_batch_size: 64
  epochs: 100
  patience: 15
  specaugment_rate: 0.2
  seed: 42

loss:
  label_smoothing: 0.0
  kd:
    temperature: 4.0
    weight: 1.0
  crd:
    proj_dim: 128
    temperature: 0.07
    weight: 1.0
