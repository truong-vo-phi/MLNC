# ==============================================================================
# Cấu hình: Single-Backbone Mixture-of-Experts (MoE) v2 Phân loại Âm thanh Kháng Nhiễu
#
# Tài liệu tham khảo:
#   - V-MoE: Riquelme et al., "Scaling Vision with Sparse Mixture of Experts", NeurIPS 2021. arXiv:2106.05974
#   - Soft MoE: Puigcerver et al., "From Sparse to Soft Mixtures of Experts", ICLR 2024. arXiv:2308.00951
#   - DeepSeekMoE: Dai et al., "DeepSeekMoE: Towards Ultimate Expert Specialization in MoE", ACL 2024. arXiv:2401.06066
#   - CED: Dinkel et al., "CED: Consistent Ensemble Distillation for Audio Tagging", ICASSP 2024. arXiv:2308.11957
#   - BEATs: Chen et al., "BEATs: Audio Pre-Training with Acoustic Tokenizers", ICML 2023. arXiv:2212.09058
#   - DeiT: Touvron et al., "Training data-efficient image transformers & distillation through attention", ICML 2021. arXiv:2012.12877
# ==============================================================================

experiment:
  name: "single_backbone_moe_v2"
  seed: 42
  num_classes: 36
  sample_rate: 16000
  duration: 4.0
  snr_levels: [-5.0, 0.0, 5.0, 10.0, 15.0, 20.0]

dataset:
  data_root: "/marimo/datasets/mix-dataset-v2"
  cache_dir: "/marimo/datasets"
  train_npy: "/marimo/datasets/train.npy"
  val_npy: "/marimo/datasets/validation.npy"
  num_workers: 4
  pin_memory: true

frontend:
  sample_rate: 16000
  n_fft: 512
  win_length: 400
  hop_length: 160
  n_mels: 64
  f_min: 20.0
  f_max: 8000.0
  num_frames: 398
  log_eps: 1.0e-6
  norm_eps: 1.0e-5
  target_rms: 0.07925

specaugment:
  freq_masks: 2
  freq_width: 8
  time_masks: 2
  time_width: 24

ced_tiny:
  arch: "deit_tiny_patch16_224"
  embed_dim: 192
  mlp_dim: 768
  num_heads: 3
  head_dim: 64
  num_blocks: 12
  patch_size: [16, 16]
  patch_stride: [16, 16]
  num_patches: 96
  seq_len: 97
  use_bias: true
  time_major: false
  pretrained_repo: "mispeech/ced-tiny"

router:
  spectral_dim: 6
  token_dim: 192
  token_proj_dim: 16
  hidden_dim: 32
  transition_center_db: 15.0
  transition_tau: 2.5
  supervised: true

split_moe:
  split_blocks: [10, 11]
  shared_expert_weight: 0.50
  routed_expert_weight: 0.50
  warm_start_identity: true
  num_routed_experts: 2

dual_classifier:
  in_features: 192
  num_classes: 36
  blending: "soft_convex"

training:
  epochs: 15
  batch_size: 64
  lr_backbone: 4.0e-5
  lr_experts: 1.2e-4
  lr_router: 2.0e-4
  weight_decay: 0.05
  warmup_epochs: 2
  mixup_alpha: 0.4
  mixup_prob: 0.8
  kd_temperature: 2.0
  lambda_hard: 0.20
  lambda_kd: 0.70
  lambda_router: 0.10
  amp_dtype: "bfloat16"

inference:
  tta_shifts: [0, 800, -800]
  t_student: 1.40
  t_teacher: 1.20
  ensemble_weight_student: 0.50
