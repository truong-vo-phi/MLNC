[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kd-moe-ced"
version = "2.0.0"
description = "Single-Backbone CED-Tiny MoE with Split-FFN, 2D GREP BiasAttention, and Self-Contained Spectral-Token Router"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "timm>=0.9.0",
    "numpy>=1.22.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.19.0",
    "safetensors>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
