model:
  num_classes: 36
  freq_bins: 64
  frames: 398
  split_blocks: [10, 11]

frontend:
  sample_rate: 16000
  target_rms: 0.07925
  n_fft: 512
  hop_length: 160
  n_mels: 64

router:
  token_proj_dim: 16
  hidden_dim: 32
  transition_center_db: 15.0
  transition_tau: 2.5

training:
  epochs: 15
  batch_size: 32
  lr_backbone: 4.0e-5
  lr_experts: 1.2e-4
  lr_router: 2.0e-4
  weight_decay: 0.05
  warmup_epochs: 2
  mixup_alpha: 0.4
  mixup_prob: 0.8
  label_smoothing: 0.05
  lambda_kd: 0.65
  lambda_route: 0.20
  kd_temperature: 2.0
  amp_dtype: bfloat16