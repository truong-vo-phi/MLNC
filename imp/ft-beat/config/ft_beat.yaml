model_config: config/beat.yaml
frcrn_config: config/frcrn.yaml

frcrn:
  checkpoint: pretrained/FRCRN/best_e037_20261020T203958Z.pt
  fallback_checkpoint: pretrained/frcrn_best.pt
  target_rms: 0.07925
  freeze: true

beats:
  checkpoint: pretrained/BEATs_iter3_plus_AS2M_finetuned_on_AS2M_cpt2.pt
  fallback_checkpoint: pretrained/BEATs_iter3_plus_AS2M.pt

data:
  dataset_key: mixture-36l
  duration: 4.0
  snr_levels: [-5.0, 0.0, 5.0, 10.0, 15.0, 20.0]
  num_workers: 0
  balanced_sampling: true
  max_train_samples: null
  max_eval_samples: null
  nhat_cache_dir: dataset/cache
  audioset_eval_segments: null
  audioset_train_segments: []

train:
  optimizer: adamw
  lr: 0.0001
  layer_decay: 0.3
  min_lr: 1.0e-6
  weight_decay: 0.01
  betas: [0.9, 0.98]
  scheduler: cosine
  warmup_ratio: 0.1
  min_lr_ratio: 0.0
  label_smoothing: 0.0
  grad_clip: 5.0
  epochs: 10
  patience: 4
  batch_size: 16
  accumulation_steps: 2
  eval_batch_size: 64
  amp: bf16
  seed: 2026
  resume_every: 1
  selection_metric: macro_f1
