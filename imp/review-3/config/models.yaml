# Existing Review-3 registry retained; group profiles and user LR choices below.
models:
  pann_cnn10:
    name: pann_cnn10
    display_name: PANN-CNN 10
    family: CNN
    module: src.models.pann_cnn10
    channels:
    - 64
    - 128
    - 256
    - 512
    dropout: 0.2
    n_mels: 128
    num_frames: 398
    description: 4-stage Convolutional Neural Network from PANNs with AvgPool and
      Dual Pooling Head
  ced_tiny:
    name: ced_tiny
    display_name: CED-Tiny
    family: Audio-Transformer
    module: src.models.ced_tiny
    hidden_dim: 192
    num_layers: 12
    num_heads: 3
    mlp_ratio: 4.0
    patch_size: 16
    dropout: 0.0
    n_mels: 64
    num_frames: 398
    description: Compact 12-layer Vision Transformer with 2D Gated Relative Position
      Bias (AudioSet Pretrained spec)
  ced_mini:
    name: ced_mini
    display_name: CED-Mini
    family: Audio-Transformer
    module: src.models.ced_mini
    hidden_dim: 256
    num_layers: 12
    num_heads: 4
    mlp_ratio: 4.0
    patch_size: 16
    dropout: 0.0
    n_mels: 64
    num_frames: 398
    description: Mid-size 12-layer Audio Transformer (D=256, H=4) with 2D Relative
      Position Bias
  ced_small:
    name: ced_small
    display_name: CED-Small
    family: Audio-Transformer
    module: src.models.ced_small
    hidden_dim: 384
    num_layers: 12
    num_heads: 6
    mlp_ratio: 4.0
    patch_size: 16
    dropout: 0.0
    n_mels: 64
    num_frames: 398
    description: Full-capacity 12-layer Audio Transformer (D=384, H=6) with 2D Relative
      Position Bias
  efficient_mn10:
    name: efficient_mn10
    display_name: Efficient-mn10
    family: CNN
    module: src.models.efficient_mn10
    arch: mobilenetv3_large_100
    width_mult: 1.0
    dropout: 0.2
    n_mels: 128
    num_frames: 398
    description: MobileNetV3-Large 1.0 backbone following EfficientAT mn10 specification
  vit_s:
    name: vit_s
    display_name: ViT-S
    family: Vision-Transformer
    module: src.models.vit_s
    hidden_dim: 384
    num_layers: 12
    num_heads: 6
    mlp_ratio: 4.0
    patch_size: 16
    dropout: 0.1
    n_mels: 128
    num_frames: 398
    description: Standard Vision Transformer Small (DeiT-S / ViT-S/16) with 1D learnable
      position embeddings
  mobilevit:
    name: mobilevit
    display_name: MobileViT
    family: Hybrid
    module: src.models.mobilevit
    arch: mobilevit_s
    dropout: 0.1
    n_mels: 128
    num_frames: 398
    description: Hybrid architecture merging MobileNet inverted residuals with light
      Transformer blocks
  mobilenet:
    name: mobilenet
    display_name: MobileNet
    family: CNN
    module: src.models.mobilenet
    arch: mobilenetv3_large_100
    dropout: 0.2
    n_mels: 128
    num_frames: 398
    description: Standard MobileNetV3 architecture optimized for low-latency mobile
      inference
  beats:
    name: beats
    display_name: BEATs
    family: Audio-Transformer
    module: src.models.beats
    hidden_dim: 768
    num_layers: 12
    num_heads: 12
    mlp_ratio: 4.0
    patch_size: 16
    dropout: 0.1
    n_mels: 128
    num_frames: 398
    description: Large-scale BEATs Audio Transformer with DeepNorm and 2D Gated Relative
      Position Bias
kd_profiles:
  source_dir: SNR_Aware/FRCRN_KD_MoE/config/unified
  hybrid_kdmoe_s:
    source_yaml: kdmoe_s_kd.yaml
    source_json: train_vit_kd.json
    lr: 0.0005
    weight_decay: 0.05
    warmup_ratio: 0.05
    kd_temperature: 2.0
    groups: 4
    route_by: class
    d: 128
    heads: 4
    n_hybrid: 2
    n_vit: 2
    frontend:
      n_mels: 128
      num_frames: 384
    specaugment:
      freq_masks: 2
      freq_width: 16
      time_masks: 2
      time_width: 24
  panns_cnn10:
    source_yaml: kdmoe_panns_cnn10.yaml
    source_json: train_panns.json
    lr: 0.0001
    weight_decay: 0.05
    warmup_ratio: 0.05
    kd_temperature: 2.0
    frontend:
      n_mels: 64
      num_frames: 400
    specaugment:
      freq_masks: 2
      freq_width: 8
      time_masks: 2
      time_width: 64
    hint_student_block: 3
    at_student_blocks:
    - 3
    - 4
    review_student_blocks:
    - 1
    - 2
    - 3
    - 4
  efficientat_mn10:
    source_yaml: kdmoe_mn10.yaml
    source_json: train_mn10.json
    variant: mn10_as
    repo_commit: a425fdc
    lr: 6.0e-05
    weight_decay: 0.05
    warmup_ratio: 0.05
    kd_temperature: 2.0
    frontend:
      n_mels: 128
      num_frames: 384
    specaugment:
      freq_masks: 0
      time_masks: 0
    hint_student_stage: 12
    at_student_stages:
    - 12
    - 16
    review_student_stages:
    - 3
    - 6
    - 12
    - 16
  ced_meanpool:
    source_yamls:
      ced_tiny: kdmoe_ced_tiny_meanpool_kd.yaml
      ced_mini: kdmoe_ced_mini_meanpool_kd.yaml
      ced_small: kdmoe_ced_meanpool_kd.yaml
    source_json_example: train_ced_tiny_meanpool_kd_t4.json
    variants:
    - ced_tiny
    - ced_mini
    - ced_small
    repo_commit: 4b2149d
    pooling: mean
    lr: 0.0001
    weight_decay: 0.01
    warmup_ratio: 0.1
    layer_decay: 0.3
    drop_path: 0.1
    kd_temperature: 4.0
    frontend:
      n_mels: 64
      num_frames: 400
    specaugment:
      freq_masks: 1
      freq_width: 12
      time_masks: 1
      time_width: 80
    note: Tên CED-Small trong file gốc dùng ced_meanpool, không phải ced_small_meanpool.
      Dùng source_json để xác định YAML chính xác.
ce_only_benchmark:
  models:
  - pann_cnn10
  - ced_tiny
  - ced_mini
  - ced_small
  - efficient_mn10
  - vit_s
  - mobilevit
  - mobilenet
  - beats
  input: raw mixture v2
  pretrained_policy: unchanged Review-3 constructors; no added weights or external
    adapters
  missing_profile_lr:
    vit_s:
      backbone: 3.0e-05
      head: 0.0003
    mobilevit:
      backbone: 3.0e-05
      head: 0.0003
    mobilenet:
      backbone: 3.0e-05
      head: 0.0003
    beats:
      backbone: 1.0e-05
      head: 0.0001
  selection: mean present-class recall (Balanced Accuracy) across six SNRs
  stage1_epochs: 0
  stage1_reason: 'CE-only: no KD/front/router stages'
