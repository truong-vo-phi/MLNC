[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlnc-kd-v5"
version = "0.1.0"
description = "BEATs to CED-Tiny knowledge distillation on Mixture-36l"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["data: requires the local mixture-36l dataset and noise cache"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["pretrained", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "B027", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]
